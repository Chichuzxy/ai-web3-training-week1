<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZKML Pipeline Agent</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe U	', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
.topbar { background: #161b22; border-bottom: 1px solid #30363d; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
.topbar .logo { font-size: 18px; font-weight: 700; color: #58a6ff; }
.topbar .badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; background: #1f2a3a; color: #58a6ff; border: 1px solid #30363d; }
.main { display: flex; height: calc(100vh - 56px); }
.left { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #30363d; overflow: hidden; }
.right { width: 340px; padding: 20px; overflow-y: auto; background: #0d1117; }
.pipeline-header { padding: 20px 24px 12px; }
.pipeline-header h2 { font-size: 16px; color: #c9d1d9; margin-bottom: 4px; }
.pipeline-header p { font-size: 12px; color: #8b949e; }
.input-area { padding: 0 24px 16px; display: flex; gap: 8px; }
.input-area input { flex: 1; padding: 10px 14px; border: 1px solid #30363d; border-radius: 6px; background: #161b22; color: #c9d1d9; font-size: 13px; outline: none; }
.input-area input:focus { border-color: #58a6ff; }
.input-area button { padding: 10px 24px; background: #238636; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
.input-area button:hover { background: #2ea043; }
.input-area button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
#log { flex: 1; overflow-y: auto; padding: 0 24px 20px; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 12px; line-height: 1.8; }
.log-info { color: #8b949e; }
.log-ok { color: #3fb950; }
.log-skip { color: #d29922; }
.log-err { color: #f85149; }
.log-highlight { color: #58a6ff; }
.log-dim { color: #484f58; }
.spinner-inline { display: inline-block; width: 10px; height: 10px; border: 2px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.right h3 { font-size: 13px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; margin-top: 24px; }
.right h3:first-child { margin-top: 0; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; margin-bottom: 8px; font-size: 12px; }
.card .label { color: #8b949e; font-size: 11px; margin-bottom: 4px; }
.card .value { color: #c9d1d9; font-size: 13px; word-break: break-all; }
.card .value.mono { font-family: monospace; font-size: 11px; }
.card a { color: #58a6ff; text-decoration: none; font-size: 12px; }
.card a:hover { text-decoration: underline; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-dot.ok { background: #3fb950; }
.status-dot.pending { background: #d29922; }
.stack { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.stack span { font-size: 11px; padding: 3px 8px; background: #21262d; border-radius: 4px; color: #8b949e; }
.fade-in { animation: fade 0.4s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">ZKML Pipeline Agent</span>
  <span class="badge">Z.AI Track</span>
  <span class="badge">Sepolia</span>
  <span style="flex:1"></span>
  <span style="font-size:12px;color:#8b949e;">Hackathon Demo</span>
</div>
<div class="main">
  <div class="left">
    <div class="pipeline-header">
      <h2>Pipeline Execution</h2>
      <p>Natural language --> 6-step automation --> On-chain ZK verification</p>
    </div>
    <div class="input-area">
      <input id="taskInput" value="让练房价预测模型，生成 ZK
